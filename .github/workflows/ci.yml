name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      # Minions are built for 32-bit platforms too (windows/386, linux/386):
      # the package must compile where int is 32 bits.
      - name: Build for 32-bit
        run: |
          GOARCH=386 go vet ./...
          GOOS=windows GOARCH=386 go build ./...
          GOARCH=arm go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # golangci-lint's default linters (errcheck, govet, ineffassign,
      # staticcheck, unused), no config file: the code is kept at 0 issues, so
      # any finding fails the job. The version is core's (ci-core.yml); the
      # action's major must match the linter's (v7 for v2).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
